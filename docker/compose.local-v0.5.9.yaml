services:
  sglang-dev:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        BRANCH_TYPE: local
        BUILD_TYPE: ${SGL_BUILD_TYPE:-all}
        CUDA_VERSION: ${SGL_CUDA_VERSION:-12.9.1}
    image: sglang:v0.5.9-local
    container_name: sglang-v0.5.9-local
    volumes:
      - ${HF_HOME:-${USERPROFILE}/.cache/huggingface}:/root/.cache/huggingface
    network_mode: host
    privileged: true
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
    entrypoint: python3 -m sglang.launch_server
    command: >
      --model-path ${SGL_MODEL_PATH:-meta-llama/Llama-3.1-8B-Instruct}
      --host 0.0.0.0
      --port ${SGL_PORT:-30000}
    ulimits:
      memlock: -1
      stack: 67108864
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: ${SGL_GPU_COUNT:-1}
              capabilities: [gpu]
